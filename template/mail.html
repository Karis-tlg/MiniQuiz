<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Verify Your Email</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .email-container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .button {
      display: inline-block;
      background-color: #615fff;
      color: #ffffff;
      padding: 12px 20px;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }
    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #777777;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="email-container">
    <h2>Xác minh địa chỉ email</h2>
    <p>Xin chào {{username}},</p>
    <p>Cảm ơn bạn đã đăng ký. Vui lòng ấn vào nút bên dưới để xác nhận địa chỉ email được đăng ký là của bạn:</p>
    <p style="text-align: center;">
      <a href="{{url}}" class="button">Xác minh</a>
    </p>
    <p>Liên kết được sử dụng trong 30 phút</p>
    <p>Nếu bạn không tạo tài khoản, vui lòng bỏ qua email này.</p>
    <div class="footer">
      &copy; 2026 MiniQuiz. All rights reserved.
    </div>
  </div>
</body>
</html>
